      - type: exists
        message: "v13/SKILL.md 应存在"
      - type: contains
        value: "qscmf-backend-v13"
        message: "应包含 v13 标识"

  - id: V13-002
    name: "v13 模式路由正确"
    description: |
      验证 v13 SKILL.md 包含所有模式路由
    file: "v13/SKILL.md"
    assertions:
      - type: contains
        value: "scaffold.md"
        message: "应路由到 scaffold.md"
      - type: contains
        value: "guide.md"
        message: "应路由到 guide.md"
      - type: contains
        value: "learn.md"
