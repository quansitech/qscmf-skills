    file: "v13/rules/crud/crud-table-columns-v13.md"
    assertions:
      - type: exists
        message: "crud-table-columns-v13.md 应存在"

  - id: V13-008
    name: "v13 scaffold 工作流包含验证引用"
    description: |
      验证 v13 scaffold 引用 verify 模式
    file: "v13/modes/scaffold.md"
    assertions:
      - type: contains
        value: "ListBuilder"
        message: "应引用 ListBuilder API"
      - type: contains
        value: "FormBuilder"
        message: "应引用 FormBuilder API"

